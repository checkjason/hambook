<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#14213d;color:#222;font-family:'Comic Neue','Comic Sans MS','Segoe UI',sans-serif;-webkit-text-size-adjust:100%}

#pn{color:#f4e9c8;align-self:center;font-weight:700;min-width:110px;text-align:center}
.pagebg{position:absolute;inset:0;background:#fbf4e1}
.panel{position:absolute;border:3px solid #111;background:#fff;overflow:hidden;border-radius:3px}
.panel .art{position:absolute;inset:0}.panel .art svg{display:block}
.ov{position:absolute;left:0;right:0;top:0;padding:5px;z-index:3;font-size:12.5px;line-height:1.22;font-weight:700}
.cap{background:#ffe27a;border:2px solid #111;padding:4px 7px;margin-bottom:5px;box-shadow:2px 2px 0 rgba(0,0,0,.35);font-weight:700;color:#222}
.bub{position:relative;display:block;width:fit-content;max-width:64%;background:#fff;border:2px solid #111;border-radius:14px;padding:4px 8px;margin-bottom:9px;color:#111}
.bub:after{content:'';position:absolute;left:var(--tx,50%);bottom:-9px;margin-left:-7px;border:7px solid transparent;border-top:9px solid #111;border-bottom:0}
.bub:before{content:'';position:absolute;left:var(--tx,50%);bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top:7px solid #fff;border-bottom:0;z-index:2}
.bub.th{border-style:dashed;border-radius:20px;background:#f0f6ff}
.gw{color:#b3202a;border-bottom:2px dotted #b3202a}
.sfx{position:absolute;font-family:'Bangers',Impact,sans-serif;font-size:34px;color:#ffe14a;-webkit-text-stroke:2px #b3202a;text-shadow:3px 3px 0 #111;letter-spacing:2px;z-index:4;white-space:nowrap}
.open .opentxt{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;background:rgba(251,244,225,.94);border:3px solid #111;padding:10px 12px;border-radius:4px}
.chn{font-family:'Bangers',Impact;letter-spacing:3px;color:#b3202a;font-size:15px}
.cht{font-family:'Bangers',Impact;font-size:34px;line-height:1.02;color:#14213d;letter-spacing:1px}
.chy{font-weight:700;color:#7a6a4a;font-size:13px;margin:2px 0 4px}
.chb{font-size:13.5px;line-height:1.28;font-weight:700}
.wb,.fr{position:absolute;inset:0;padding:14px 16px 26px;display:flex;flex-direction:column}
.wb{background:linear-gradient(#fbf4e1,#f6ecce)}
.wbh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid #14213d;padding-bottom:4px;margin-bottom:8px}
.wbt{font-family:'Bangers',Impact;font-size:22px;letter-spacing:1px;color:#14213d}.wbs{font-size:11px;font-weight:700;color:#b3202a;letter-spacing:2px}
.wbody{overflow:auto;flex:1;padding-right:4px;font-size:13.5px;line-height:1.28}

.opt{display:block;width:100%;text-align:left;font:inherit;font-size:13px;padding:4px 8px;margin:3px 0;border:2px solid #9aa7c0;background:#f4f7ff;border-radius:8px;cursor:pointer}
.opt:hover:not(:disabled){background:#e0ebff}.opt.good{background:#c8f0c8;border-color:#2f8f57}.opt.bad{background:#ffd6d6;border-color:#c0392b;opacity:.8}
.tfrow{display:flex;gap:8px}.tfrow .opt{text-align:center;font-weight:700}
.fb{font-size:12.5px;font-weight:700;color:#2f6b45;margin-top:3px;min-height:0}
.ord{display:flex;gap:6px;align-items:center;margin:3px 0}.ord select{font:inherit;font-size:13px;padding:2px;border-radius:6px;border:2px solid #9aa7c0;min-width:44px}
.mdefs{background:#f4f7ff;border-radius:6px;padding:4px 7px;margin-bottom:4px;font-size:12.5px}
.chk,.mini{font:inherit;font-weight:700;font-size:12.5px;padding:3px 10px;margin-top:4px;border-radius:8px;border:2px solid #14213d;background:#ffd24a;cursor:pointer}
.fin{font:inherit;font-size:13px;padding:3px 7px;border:2px solid #9aa7c0;border-radius:6px;width:55%}.fin.sm{width:110px}
.wr{width:100%;font:inherit;font-size:13px;padding:5px 7px;border:2px solid #9aa7c0;border-radius:8px;background:#fffef8;resize:vertical}
.vw{margin:2px 0}.scr{display:flex;gap:8px;align-items:center;margin:3px 0}.scw{font-family:'Bangers';letter-spacing:3px;font-size:18px;min-width:120px;color:#b3202a}.hint{font-size:12px;color:#666}
.dr{width:100%;border:2px solid #14213d;border-radius:8px;background:#fffdf6;touch-action:none}.drt{display:flex;gap:6px;align-items:center;margin-top:3px}.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #333;cursor:pointer}
.ws{display:grid;gap:1px;max-width:330px;margin:4px auto;user-select:none}.ws i{font-style:normal;font-weight:700;text-align:center;background:#f4f7ff;border:1px solid #cfd8ea;padding:2px 0;font-size:14px;cursor:pointer;font-family:'Comic Neue',sans-serif}.ws i.on{background:#ffd24a}
.wl{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.wl span{background:#eef2fb;border:1px solid #9aa7c0;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;cursor:pointer}.wl span.found{text-decoration:line-through;background:#c8f0c8}
.note2{font-size:11.5px;color:#666;text-align:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.fc{perspective:600px;min-height:76px;position:relative;cursor:pointer}
.fcf,.fcb{position:absolute;inset:0;padding:5px 7px;border-radius:8px;border:2px solid #14213d;backface-visibility:hidden;transition:transform .4s;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center}
.fcf{background:#fff3c4}.fcb{background:#d8f0d8;transform:rotateY(180deg)}.fc.flip .fcf{transform:rotateY(180deg)}.fc.flip .fcb{transform:rotateY(0)}
.cb{display:flex;gap:7px;align-items:flex-start;margin:3px 0;font-size:13px;cursor:pointer}.cb input{margin-top:3px;width:16px;height:16px}
.fr h1{font-family:'Bangers';letter-spacing:2px;color:#14213d;font-size:30px;line-height:1.05}.fr h2{font-family:'Bangers';letter-spacing:1px;color:#b3202a;font-size:19px;margin:6px 0 2px}
.fr p,.fr li{font-size:13.5px;line-height:1.3;margin:3px 0}.fr ul{padding-left:18px}
.fr.cover{padding:0;background:linear-gradient(#14213d,#27406e 55%,#c0392b);color:#fff;align-items:center;text-align:center;justify-content:space-between}
.cover .ct{padding:26px 20px 0}.cover .ct1{font-family:'Bangers';letter-spacing:4px;color:#ffd24a;font-size:20px}.cover .ct2{font-family:'Bangers';font-size:62px;line-height:.92;letter-spacing:2px;color:#fff;text-shadow:4px 4px 0 #b3202a;margin:8px 0}.cover .ct3{font-weight:700;font-size:16px;color:#f4e9c8}
.cover svg{width:100%;flex:1;min-height:0}
.cover .cb2{padding:8px 16px 22px;font-weight:700;font-size:13px;color:#f4e9c8}
.cast{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:auto}.cc{background:#fff;border:2px solid #14213d;border-radius:8px;padding:3px 6px;display:flex;gap:6px;align-items:center}.cc svg{flex:0 0 52px;height:78px;background:#e8f2fa;border-radius:6px}.cc .ci{font-size:11.5px;line-height:1.2}.cc .ci b{display:block;font-size:13px;color:#14213d}
.tl{overflow:auto;flex:1}.te{display:flex;gap:8px;border-left:4px solid #b3202a;margin-left:6px;padding:2px 0 2px 8px;font-size:12.5px;line-height:1.22}.te b{min-width:48px;color:#14213d}.te.big{background:#fff3c4}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl td,.tbl th{border:2px solid #14213d;padding:3px 6px;vertical-align:top}.tbl th{background:#14213d;color:#ffd24a;font-family:'Bangers';letter-spacing:1px;font-size:14px}
.gl{overflow:auto;flex:1}.gl div{margin:3px 0;font-size:12.5px;line-height:1.22;padding:2px 6px;border-radius:6px;background:#fff;border:1px solid #cfd8ea}.gl b{color:#b3202a}
.cert{background:#fffaf0;border:10px double #b8860b;margin:10px 10px 26px;align-items:center;text-align:center;justify-content:center;gap:8px}
.cert h1{font-size:40px}.cert .big{font-family:'Bangers';font-size:34px;color:#b3202a}.cert input{font:inherit;font-size:22px;text-align:center;border:none;border-bottom:3px solid #14213d;background:transparent;width:80%}
.tocl{display:block;padding:5px 9px;margin:4px 0;background:#fff;border:2px solid #14213d;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;text-align:left;font-family:inherit;width:100%}.tocl:hover{background:#fff3c4}
@media (max-width:720px){#bar .ttl{font-size:16px}}

.page.gem{background:#fbf4e1}.gimg{display:block;width:500px;height:680px;object-fit:fill;user-select:none;-webkit-user-drag:none}
</style></head><body>
<div id="bar"><span class="ttl">ALEXANDER HAMILTON</span><span id="stars">★ 0</span><span><button id="home">Cover</button> <button id="toc">Contents</button> <select id="sel"></select></span></div>

<script>/* ===== Scenes: parametric SVG backgrounds ===== */
const RNG=(s)=>{let t=(s>>>0)||1;return()=>((t=(Math.imul(t,1664525)+1013904223)>>>0)/4294967296)};
const sky=(id,a,b,W,h)=>`<defs><linearGradient id="s${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="${W}" height="${h}" fill="url(#s${id})"/>`;
const rc=(x,y,w,h,f,e='')=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${f}" ${e}/>`;
const ci=(x,y,r,f,e='')=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${f}" ${e}/>`;
const pl=(p,f,e='')=>`<polygon points="${p}" fill="${f}" ${e}/>`;
const pa=(d,f,e='')=>`<path d="${d}" fill="${f}" ${e}/>`;
const ln=(x1,y1,x2,y2,c,w=2,e='')=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${e}/>`;
const el=(x,y,rx,ry,f,e='')=>`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${f}" ${e}/>`;
const cloud=(x,y,s,f='#fff',o=.92)=>`<g opacity="${o}">${ci(x,y,12*s,f)}${ci(x+15*s,y-7*s,15*s,f)}${ci(x+32*s,y,12*s,f)}${rc(x,y-1*s,32*s,11*s,f)}${el(x+16*s,y+7*s,19*s,5*s,'#9db8d6','opacity=".35"')}${ci(x+12*s,y-11*s,6*s,'#fff','opacity=".7"')}</g>`;
const stars=(W,H,r,n,lim)=>{let s='';for(let i=0;i<n;i++)s+=ci(r()*W,r()*H*lim,.6+r()*1.1,'#fff',`opacity="${.5+r()*.5}"`);return s};
const palm=(x,y,h,lean=20)=>{const tx=x+lean,ty=y-h;let f='';[-170,-135,-100,-60,-25,10,45].forEach(a=>{const rad=a*Math.PI/180,l=h*.3;f+=el(tx+Math.cos(rad)*l*.9,ty+Math.sin(rad)*l*.55,l,h*.055,'#2f9e4f',`transform="rotate(${a} ${tx+Math.cos(rad)*l*.9} ${ty+Math.sin(rad)*l*.55})"`)});return `<path d="M${x} ${y} Q${x+lean*.2} ${y-h*.5} ${tx} ${ty}" stroke="#8a5a2b" stroke-width="${Math.max(4,h*.07)}" fill="none" stroke-linecap="round"/>${f}${ci(tx,ty+3,h*.04,'#6b4423')}`};
const tree=(x,y,h,c='#3d8b3d')=>`${rc(x-h*.04,y-h*.35,h*.08,h*.35,'#6b4423')}${ci(x,y-h*.55,h*.28,c)}${ci(x-h*.15,y-h*.42,h*.2,c)}${ci(x+h*.15,y-h*.42,h*.2,c)}`;
const bare=(x,y,h)=>`<g stroke="#4a3a2a" stroke-linecap="round" fill="none">${ln(x,y,x,y-h,'#4a3a2a',h*.06)}${ln(x,y-h*.5,x-h*.22,y-h*.8,'#4a3a2a',h*.035)}${ln(x,y-h*.62,x+h*.24,y-h*.9,'#4a3a2a',h*.035)}${ln(x,y-h*.8,x-h*.1,y-h*1.02,'#4a3a2a',h*.025)}</g>`;
const house=(x,y,w,h,c,roof='#5a3a30',win='#ffe9a8')=>{let s=rc(x,y-h,w,h,c)+pl(`${x-4},${y-h} ${x+w/2},${y-h-h*.28} ${x+w+4},${y-h}`,roof);const cols=Math.max(2,Math.round(w/26)),rows=Math.max(2,Math.round(h/36));for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)s+=rc(x+8+i*(w-16)/cols+2,y-h+10+j*(h-14)/rows,Math.min(11,(w-16)/cols-6),12,win,'stroke="#3a2a20" stroke-width="1"');return s+rc(x+w/2-6,y-18,12,18,'#4a2f20')};
const ship=(x,y,s,sail='#f4ecd8',hull='#5b3a24')=>`<g>${pa(`M${x-40*s} ${y} L${x+44*s} ${y} L${x+32*s} ${y+14*s} L${x-28*s} ${y+14*s} Z`,hull)}${ln(x,y,x,y-70*s,'#3a2a1a',2.5*s)}${pa(`M${x+3*s} ${y-66*s} Q${x+34*s} ${y-40*s} ${x+3*s} ${y-8*s} Z`,sail)}${pa(`M${x-3*s} ${y-60*s} Q${x-28*s} ${y-38*s} ${x-3*s} ${y-10*s} Z`,sail)}${ln(x,y-70*s,x+16*s,y-66*s,'#b32d2d',2*s)}</g>`;
const flagUS=(x,y,w)=>{let s=ln(x,y,x,y-w*1.6,'#6b4423',2.5);const fx=x,fy=y-w*1.6,h=w*.7;for(let i=0;i<7;i++)s+=rc(fx,fy+i*h/7,w,h/7+.3,i%2?'#fff':'#c0392b');return s+rc(fx,fy,w*.42,h*4/7,'#2a3f8f')+`<g fill="#fff">${[0,1,2].map(a=>[0,1,2].map(b=>ci(fx+w*.07+b*w*.13,fy+h*.1+a*h*.17,1.1,'#fff')).join('')).join('')}</g>`};
const smoke=(W,H,r,n,col='#cfc7c0')=>{let s='';for(let i=0;i<n;i++)s+=ci(r()*W,H*(.35+r()*.35),12+r()*22,col,`opacity="${.35+r()*.3}"`);return s};
const win=(x,y,w,h,view='#9fd8f2')=>`${rc(x-4,y-4,w+8,h+8,'#6b4a2f')}${rc(x,y,w,h,view)}${ln(x+w/2,y,x+w/2,y+h,'#6b4a2f',3)}${ln(x,y+h/2,x+w,y+h/2,'#6b4a2f',3)}`;
const floorW=(W,H,y,c1='#a9703f',c2='#8a5a30')=>{let s=rc(0,y,W,H-y,c1);for(let i=0;i<8;i++)s+=ln(0,y+(H-y)*i/8,W,y+(H-y)*i/8,c2,1.2,'opacity=".6"');return s};
const col=(x,y,h,w,c='#efe6d4')=>rc(x,y,w,h,c)+rc(x-w*.15,y,w*1.3,h*.05,c,'stroke="#cfc3a8" stroke-width="1"')+rc(x-w*.15,y+h*.95,w*1.3,h*.05,c,'stroke="#cfc3a8" stroke-width="1"');
const waves=(W,y,h,c,r,n=14)=>{let s='';for(let i=0;i<n;i++){const x=r()*W,yy=y+r()*h;s+=`<path d="M${x} ${yy} q6 -5 12 0 t12 0" stroke="${c}" stroke-width="1.6" fill="none" opacity=".8"/>`}return s};
const lightning=(x,y,s)=>pl(`${x},${y} ${x-10*s},${y+30*s} ${x},${y+28*s} ${x-14*s},${y+70*s} ${x+16*s},${y+22*s} ${x+4*s},${y+24*s} ${x+14*s},${y}`,'#fff7a8','stroke="#ffd43b" stroke-width="1.5"');

const SCENES={

function buildSearch(el){const words=el.dataset.w.split('|').map(w=>w.toUpperCase().replace(/[^A-Z]/g,''));const N=11;const r=RNG(+el.dataset.seed*101+words.length);const g=Array.from({length:N},()=>Array(N).fill(''));
const dirs=[[0,1],[1,0],[1,1],[0,-1],[-1,0]];words.slice().sort((a,b)=>b.length-a.length).forEach(w=>{for(let t=0;t<300;t++){const d=dirs[Math.floor(r()*(w.length>N-1?2:3))];const x0=Math.floor(r()*N),y0=Math.floor(r()*N);const x1=x0+d[0]*(w.length-1),y1=y0+d[1]*(w.length-1);if(x1<0||x1>=N||y1<0||y1>=N)continue;let ok=1;for(let i=0;i<w.length;i++){const c=g[y0+d[1]*i][x0+d[0]*i];if(c&&c!==w[i]){ok=0;break}}if(!ok)continue;for(let i=0;i<w.length;i++)g[y0+d[1]*i][x0+d[0]*i]=w[i];break}});
const A='ABCDEFGHIJKLMNOPRSTUVWY';el.innerHTML=g.map(row=>row.map(c=>`<i>${c||A[Math.floor(r()*A.length)]}</i>`).join('')).join('');
el.style.gridTemplateColumns=`repeat(${N},1fr)`;el.querySelectorAll('i').forEach(i=>i.onclick=()=>i.classList.toggle('on'));
const wl=$('#wl'+el.id);wl.querySelectorAll('span').forEach(s=>s.onclick=()=>s.classList.toggle('found'))}

ST(6,'G4',[

/* Chapter 8: A Country That Wasn't Working */
OP(7,'A Country That Wasn\'t Working','1781–1787 · The Articles & the Convention','hall',['wash@.2:neutral','madi@.45:think','ham_c@.7:smile','ben@.9:smile'],'The war was won. But the new government was falling apart. A secret summer meeting in Philadelphia would try to invent something brand new.');

ST(7,'S3',[
['hall',['reader@.3:think:hold:scroll','adams@.72:neutral'],'After the war, the states ran the country under a plan called the Articles of Confederation. It created a weak Congress and no president.',[]],
['hall',['adams@.3:worry','ben@.72:sad'],'Congress couldn\'t collect taxes. It couldn\'t force states to obey. It couldn\'t even pay its soldiers and debts.',[['adams','We have no money!']]],
['city',['cit3@.3:angry:hold:bag','cit5@.72:angry'],'Each state printed its own money and made its own trade rules. Doing business across state lines was a mess.',[['cit3','That money is no good here!']]]]);

ST(7,'T3',[
['farm',['farmer@.3:angry:hold:pitchfork','cit2@.75:angry:hold:pitchfork'],'Massachusetts, 1786: farmers drowning in debt and taxes rose up. Led by Daniel Shays, they shut down courts.',[['farmer','No more unfair taxes!']]],
['battle',['sold@.3:neutral:hold:musket','sold2@.7:neutral:hold:musket'],'Congress had no army to help. A private militia ended the revolt.',[]],
['room',['wash@.3:worry','ham_c@.75:worry'],'Washington and Hamilton were alarmed. The country was coming apart.',[['wash','This cannot continue.']]]]);

ST(7,'S2',[
['room',['ham_c@.3:smile:point','madi@.7:smile'],'In 1786 a small meeting in Annapolis, Maryland, drew delegates from only five states. Hamilton and Madison used it to call for a bigger meeting to fix the government.',[['ham_c','We need a whole new plan.'],['madi','Agreed.']]],
['hall',['wash@.3:neutral','ham_c@.55:smile','madi@.8:smile'],'The call was heard. Delegates would gather in Philadelphia in May 1787.',[]]]);

ST(7,'G4',[
['hall',['wash@.2:neutral:hold:scroll','ben@.5:smile','madi@.8:think'],'May 1787: fifty-five delegates gathered in Philadelphia. Washington was chosen to lead the meeting.',[]],
['hall',['ben@.3:worry','adams@.72:worry'],'They kept the windows shut and the talks secret — even in the summer heat.',[['ben','Phew! It\'s hot in here.']]],
['hall',['ham_c@.3:shout:point','madi@.65:worry','ben@.9:neutral'],'Hamilton gave a six-hour speech for a very strong national government. Most delegates thought it went too far.',[['ham_c','Only a strong union can protect us!']]],
['room',['ham_c@.5:think'],'His plan wasn\'t adopted. But he stayed to help. A flawed plan beats no plan.',[['~ham_c','I\'ll work with what we get.']]]]);

ST(7,'T3',[
['hall',['madi@.3:angry:point','cit3@.75:angry:point'],'Big fight: how many votes should each state get? Big states wanted votes by population. Small states wanted equal votes.',[['madi','Population should count!'],['cit3','Every state is equal!']]],
['hall',['ben@.5:smile:point'],'The Great Compromise: a House based on population and a Senate with two senators per state.',[['ben','Let\'s do BOTH.']]],
['hall',['adams@.5:smile:hold:scroll'],'Together, the House and Senate form Congress.',[]]]);

ST(7,'S3',[
['hall',['cit4@.3:sad','wom2@.7:sad'],'The delegates also argued about slavery. The Three-Fifths Compromise counted each enslaved person as three-fifths of a person for representation — even though enslaved people had no vote and no rights.',[]],
['hall',['ben@.3:sad','ham_c@.7:sad'],'The Constitution even let the slave trade continue until at least 1808. Many delegates knew it was wrong, but they compromised to hold the states together. Slavery would last for decades — and take a civil war to end.',[]],
['federal',['ham_c@.3:smile:hold:scroll','wash@.7:smile'],'On September 17, 1787, thirty-nine delegates signed the Constitution. Hamilton was the only signer from New York. Now the states had to approve it.',[]]]);

/* Chapter 9: Publius Takes Up His Pen */
CHARS.jay=mk({hair:'#cfc8bd',hs:'wig',coat:'#2a3a4a',trim:'#fbf7ee',hf:.96});
OP(8,'Publius Takes Up His Pen','1787–1789 · The Federalist Papers','room:night',['ham_c@.5:think:write:quill'],'The Constitution was only a proposal. The states had to say yes. So Alexander picked up his pen — and wrote under a secret name.');

ST(8,'S3',[
['hall',['reader@.3:smile:hold:scroll','cit1@.7:think'],'The Constitution was only a proposal. Nine of the thirteen states had to approve — to "ratify" — it before it became law.',[]],
['city',['cit1@.2:angry:point','cit3@.5:smile','wom1@.8:think'],'Americans argued everywhere: in newspapers, taverns, and kitchens.',[['cit1','Congress gets too much power!'],['cit3','We need a strong union!']]],
['room',['ham_c@.3:smile','cit2@.72:worry:hold:scroll'],'Supporters were called Federalists. Opponents, Anti-Federalists, feared a government that could trample their liberty.',[['cit2','Where are our rights written down?']]]]);

ST(8,'T3',[
['room:night',['ham_c@.2:grin:write:quill','madi@.5:smile:write:quill','jay@.8:smile:write:quill'],'Hamilton recruited James Madison and John Jay to write essays explaining the Constitution — all under the pen name "Publius."',[['ham_c','We\'ll sign every one "Publius."']]],
['room:night',['ham_c@.5:think:write:quill'],'Hamilton wrote fast — sometimes several essays a week while working as a lawyer.',[['~ham_c','Another essay due tonight!']]],
['city',['cit1@.3:smile:hold:letter','wom1@.72:smile'],'The essays appeared in New York newspapers.',[['cit1','Have you read today\'s essay?']]]]);

ST(8,'S2',[
['paper',['ham_c@.2:smile:hold:book','madi@.5:smile:hold:book','jay@.8:smile:hold:book'],'In all, 85 essays were published. Hamilton wrote about 51, Madison about 29, and Jay 5. They are called the Federalist Papers, and judges and lawyers still read them today.',[]],
['room',['ham_c@.3:smile:point','cit2@.72:think'],'They explained how the new government would protect freedom: strong, but with its power divided so no one could seize all of it.',[['ham_c','Power must check power.']]]]);

ST(8,'G4',[
['hall',['reader@.25:smile:hold:scroll','wash@.55:smile','ben@.85:smile'],'Three branches: Congress makes laws, the President carries them out, and the courts explain them. Each can stop the others from going too far: checks and balances.',[]],
['room',['ham_c@.5:smile:point'],'Hamilton argued that the President should be strong enough to act, and the courts independent enough to protect the Constitution.',[]],
['hall',['ham_c@.3:shout:point','cit2@.75:angry'],'New York\'s delegates mostly opposed the Constitution. Hamilton argued for weeks at the state meeting in Poughkeepsie.',[['ham_c','Unity makes us strong!']]],
['hall',['cit1@.3:grin:up','cit3@.72:surprise'],'Then big news: Virginia and New Hampshire had approved. It would go into effect — with or without New York!',[]]]);

ST(8,'T3',[
['federal',['ham_c@.35:grin:up','madi@.75:smile'],'July 26, 1788: New York voted yes, 30 to 27. Hamilton had helped win a key state.',[]],
['hall',['cit2@.5:think:hold:scroll'],'Anti-Federalists still wanted basic freedoms in writing.',[['cit2','Put our rights on paper!']]],
['hall',['madi@.5:smile:hold:scroll'],'Madison promised a Bill of Rights. By 1791, ten amendments protected free speech, religion, fair trials, and more.',[['madi','Your rights, in writing.']]]]);

ST(8,'S3',[
['federal',['wash_p@.5:neutral'],'In 1789 electors chose George Washington as the first President — unanimously.',[]],
['federal',['wash_p@.4:smile:up','adams@.65:smile','cit1@.88:grin:up'],'On April 30, 1789, he took the oath of office in New York City, the first capital.',[]],
['room',['wash_p@.3:neutral:point','ham_c@.72:surprise'],'Washington asked Alexander to be the first Secretary of the Treasury. The country was broke and needed a financial genius.',[['wash_p','Will you serve, Colonel?']]]]);

/* Chapter 10: The Treasury Secretary */
OP(9,'The Treasury Secretary','1789–1795 · Building an Economy','bank',['ham_c@.4:smile:hold:ledger','wash_p@.75:neutral'],'A brand-new country, millions in debt, no banks, no coins. Alexander\'s job: make it work.');

ST(9,'S3',[
['bank',['ham_c@.3:worry:hold:ledger','wash_p@.72:neutral'],'In 1789 the United States was broke. It owed millions to other countries, banks, and soldiers it hadn\'t paid.',[]],
['room:night',['ham_c@.5:think:write:quill'],'Alexander studied the numbers day and night — and made a bold plan.',[['~ham_c','Pay every debt. Trust will follow.']]],
['bank',['ham_c@.3:grin:point','madi@.72:worry'],'The national government would pay its debts in full — and take over the states\' war debts too. Then lenders everywhere would trust the new country.',[['ham_c','A nation that pays its debts earns trust.']]]]);

ST(9,'T3',[
['room',['jeff@.3:angry:point','madi@.75:angry'],'Jefferson and Madison objected. States like Virginia had paid most of their debts and didn\'t want to help others.',[['jeff','That\'s unfair to Virginia!']]],
['room:warm',['jeff@.2:smile:hold:cup','ham_c@.5:smile','madi@.8:smile'],'Congress deadlocked. So in June 1790, Jefferson hosted a dinner for the three of them.',[]],
['room:warm',['madi@.3:smile','jeff@.72:smile'],'The deal: Madison would stop blocking Hamilton\'s plan. In return, the permanent capital would move south to the Potomac River.',[['madi','Deal.']]]]);

ST(9,'S2',[
['federal',['wash_p@.4:smile:point','cit1@.8:smile'],'That is why Washington, D.C. exists! The capital moved to Philadelphia for ten years, then to a brand-new city on the Potomac.',[['wash_p','A capital on the Potomac.']]],
['bank',['ham_c@.3:smile:hold:ledger','cit5@.72:smile:hold:bag'],'Hamilton also proposed a national bank to hold government money, lend to businesses, and steady the economy.',[['cit5','A loan for my shop!']]]]);

ST(9,'G4',[
['room',['jeff@.3:angry:point','ham_c@.72:angry:point'],'Jefferson said the Constitution didn\'t allow a bank. Hamilton said Congress may do what is "necessary and proper" to carry out its duties.',[]],
['room',['wash_p@.5:think:hold:scroll'],'Washington listened to both — and sided with Hamilton. The bank opened in 1791.',[]],
['bank',['ham_c@.3:smile:hold:coin','cit1@.75:grin'],'The U.S. Mint began making American coins, with the dollar as the main unit.',[['cit1','Real American money!']]],
['harbor',['ham_c@.5:smile:point'],'He also created a fleet of revenue cutters to catch smugglers. It grew into today\'s U.S. Coast Guard!',[]]]);

ST(9,'T3',[
['room',['ham_c@.3:smile:point','jeff@.72:smile:point'],'Hamilton wanted a nation of cities, banks, and factories. Jefferson dreamed of a nation of small farms.',[['ham_c','Industry will make us strong!'],['jeff','Farmers keep us free!']]],
['hall',['ham_c@.3:smile','jeff@.72:smile'],'Their followers formed America\'s first political parties: Federalists and Democratic-Republicans.',[]],
['room',['wash_p@.5:worry'],'Washington hated parties. He feared they would divide the country. But they were here to stay.',[['wash_p','Please, no factions!']]]]);

ST(9,'S3',[
['farm',['farmer@.3:angry:hold:pitchfork','cit2@.72:angry'],'In 1794, farmers in western Pennsylvania refused to pay a new whiskey tax and attacked tax collectors.',[['farmer','No tax on our whiskey!']]],
['field',['wash_s@.3:neutral:point','ham_s@.72:smile:hold:sword'],'Washington himself rode out with about 13,000 militia. Hamilton rode at his side.',[]],
['farm',['ham_c@.25:smile','eliza@.55:smile','phil@.82:smile'],'The rebels melted away. The new government had shown it could enforce its laws. In January 1795, Alexander resigned to earn money for his growing family.',[]]]);

/* Chapter 11: Honor, Heartbreak & Legacy */
OP(10,'Honor, Heartbreak & Legacy','1791–1854 · The Final Chapters','church',['eliza@.35:smile','ham_o@.7:neutral'],'Alexander\'s greatest work was done, but his hardest years were ahead. Some of this chapter is sad, because real history has sad parts too.');

ST(10,'S3',[
['room:cool',['ham_c@.5:sad:hold:letter'],'Alexander made a serious mistake in the 1790s. He broke Eliza\'s trust by having a secret relationship with another woman. Her husband blackmailed him for money.',[['~ham_c','What have I done?']]],
['room',['ham_c@.5:worry:write:quill'],'Years later, people accused him of misusing government money. To prove he hadn\'t, Alexander published the whole embarrassing story in 1797.',[['~ham_c','Better the truth from me.']]],
['room:cool',['eliza@.3:sad','ham_c@.72:sad'],'It cleared his name as a public official, but it deeply hurt his family. Eliza was wounded. In time she forgave him, and they stayed together.',[['ham_c','I am so sorry, Eliza.'],['eliza','It will take time.']]]]);

ST(10,'T3',[
['federal',['wash_p@.3:smile:hold:scroll','ham_c@.75:smile:write:quill'],'In 1796 Washington announced he would not run for a third term. Hamilton helped him write the Farewell Address, warning against bitter parties.',[['wash_p','Two terms are enough.']]],
['farm',['wash_p@.5:neutral'],'Washington went home to Mount Vernon. He died in December 1799.',[]],
['church',['cit1@.3:sad','wom1@.72:sad'],'The nation mourned.',[]]]);

ST(10,'S2',[
['hall',['jeff@.3:neutral:hold:scroll','burr@.72:neutral:hold:scroll'],'In 1800 Thomas Jefferson and Aaron Burr tied in the Electoral College. The House of Representatives had to break the tie.',[]],
['room',['ham_c@.3:think:point','madi@.72:smile'],'Hamilton disliked Jefferson\'s politics but distrusted Burr even more. He urged friends to choose Jefferson. After 36 votes, Jefferson won, and Burr became Vice President.',[['ham_c','Jefferson has principles. Burr has ambition.']]]]);

ST(10,'G4',[

HP(`<h1>Civics Corner: The Three Branches</h1><p style="font-size:12.5px">The Constitution splits power into three branches, so no one person or group can take over. Hamilton explained this in the Federalist Papers.</p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0">
<div style="background:#dbe7ff;border:3px solid #14213d;border-radius:10px;padding:6px;text-align:center"><div style="font-size:26px">🏛️</div><b style="font-family:Bangers;font-size:17px;color:#14213d">LEGISLATIVE</b><div style="font-size:12px">Congress<br>Senate + House</div><div style="font-size:12px;margin-top:3px;font-weight:700;color:#b3202a">MAKES the laws</div></div>
<div style="background:#ffe3e3;border:3px solid #14213d;border-radius:10px;padding:6px;text-align:center"><div style="font-size:26px">🇺🇸</div><b style="font-family:Bangers;font-size:17px;color:#14213d">EXECUTIVE</b><div style="font-size:12px">President<br>+ Cabinet</div><div style="font-size:12px;margin-top:3px;font-weight:700;color:#b3202a">CARRIES OUT the laws</div></div>
<div style="background:#e0f5e0;border:3px solid #14213d;border-radius:10px;padding:6px;text-align:center"><div style="font-size:26px">⚖️</div><b style="font-family:Bangers;font-size:17px;color:#14213d">JUDICIAL</b><div style="font-size:12px">Supreme Court<br>+ other courts</div><div style="font-size:12px;margin-top:3px;font-weight:700;color:#b3202a">EXPLAINS the laws</div></div></div>
<h2>Checks &amp; balances in action</h2><ul><li>Congress passes a bill → the <b>President can veto it</b> (say no).</li><li>Congress can <b>override a veto</b> with a two-thirds vote.</li><li>The President picks judges → the <b>Senate must approve</b> them.</li><li>Courts can <b>strike down</b> laws that break the Constitution.</li><li>Congress can <b>impeach</b> (formally accuse) a President who commits serious wrongs.</li></ul>
<h2>Hamilton's cabinet seat</h2><p>The "Cabinet" is the President's team of advisors. Hamilton led the <b>Treasury</b>, Jefferson led <b>State</b> (foreign affairs). Today there are 15 executive departments.</p>`,1);

HP(`<h1>The Bill of Rights</h1><p style="font-size:12.5px">Ten amendments added in 1791 to protect your basic freedoms.</p><table class="tbl"><tr><th>#</th><th>What it protects (kid version)</th></tr>
<tr><td>1</td><td>Speech, religion, press, gathering peacefully, asking government to fix problems</td></tr><tr><td>2</td><td>The right to keep and bear arms (people still debate exactly what this means)</td></tr><tr><td>3</td><td>Soldiers can't force their way into your home</td></tr><tr><td>4</td><td>No unreasonable searches of you or your things</td></tr><tr><td>5</td><td>Fair treatment when accused of a crime; you don't have to testify against yourself</td></tr><tr><td>6</td><td>A fast, fair trial with a lawyer</td></tr><tr><td>7</td><td>Juries in many court cases</td></tr><tr><td>8</td><td>No cruel or unusual punishments</td></tr><tr><td>9</td><td>You have other rights even if they aren't listed</td></tr><tr><td>10</td><td>Powers not given to the national government belong to the states and the people</td></tr></table>`);
